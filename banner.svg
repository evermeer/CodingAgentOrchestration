<line x1="405" y1="568" x2="405" y2="600" stroke="#66BB6A" stroke-width="1"/>

<!-- ================= AGENT LOOP (center) ================= -->

<!-- Arrow Orchestrator → Agent -->
<line x1="410" y1="334" x2="580" y2="335" stroke="url(#flow)" stroke-width="2" marker-end="url(#arrowPink)"/>

<g transform="translate(720,335)">
  <!-- Loop circle -->
  <circle r="105" stroke="url(#flow)" stroke-width="2" fill="none" filter="url(#glow)" />

  <!-- Rotating dashes -->
  <circle r="95" stroke="#00f5ff" stroke-dasharray="8 16" fill="none" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- Loop labels (inside) -->
  <text x="0" y="-65" text-anchor="middle" fill="#FFF176" font-family="monospace" font-size="11" font-weight="bold">GOAL</text>
  <text x="72" y="5" text-anchor="middle" fill="#EF5350" font-family="monospace" font-size="11" font-weight="bold">PLAN</text>
  <text x="0" y="75" text-anchor="middle" fill="#42A5F5" font-family="monospace" font-size="11" font-weight="bold">ACT</text>
  <text x="-72" y="5" text-anchor="middle" fill="#66BB6A" font-family="monospace" font-size="11" font-weight="bold">REFLECT</text>

  <!-- Agent core -->
  <circle r="40" stroke="#00f5ff" fill="none" stroke-width="1.5" filter="url(#glow)">
    <animate attributeName="r" values="40;44;40" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <text text-anchor="middle" y="-5" fill="#00f5ff" font-family="monospace" font-size="13" font-weight="bold">Agent</text>
  <text text-anchor="middle" y="12" fill="#00f5ff" font-family="monospace" font-size="10">Runtime</text>
</g>

