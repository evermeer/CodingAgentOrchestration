<text x="405" y="553" fill="#66BB6A" text-anchor="middle" font-family="monospace" font-size="11">LSP Client</text>

<rect x="360" y="600" width="100" height="34" rx="6" stroke="#66BB6A" fill="none" stroke-width="1.2"/>
<text x="410" y="621" fill="#66BB6A" text-anchor="middle" font-family="monospace" font-size="11">Lang Servers</text>

<!-- Dotted line from LSP Client to agent loop border (from top of box) -->
<g>
  <line x1="405" y1="530" x2="631" y2="390" stroke="#66BB6A" stroke-width="1" stroke-dasharray="4 3">
    <animate attributeName="stroke" values="#66BB6A;#b9f6ca;#66BB6A" keyTimes="0;0.056;1" dur="6.3s" begin="0.9s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1;1.9;1" keyTimes="0;0.056;1" dur="6.3s" begin="0.9s" repeatCount="indefinite"/>
  </line>
  <line x1="405" y1="530" x2="631" y2="390" stroke="#d9ffe0" stroke-width="4" stroke-dasharray="4 3" stroke-linecap="round" opacity="0" filter="url(#lineShine)">
