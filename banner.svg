<svg width="1070" height="700" viewBox="0 0 1070 700" xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#050510"/>
    <stop offset="100%" stop-color="#0a0f2a"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="lineShine" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <linearGradient id="flow" x1="0" x2="1">
    <stop offset="0%" stop-color="#00f5ff"/>
    <stop offset="100%" stop-color="#ff00c8"/>
  </linearGradient>

  <linearGradient id="flowBack" x1="1" x2="0">
    <stop offset="0%" stop-color="#00f5ff"/>
    <stop offset="100%" stop-color="#ff00c8"/>
  </linearGradient>
</defs>

<rect width="100%" height="100%" fill="url(#bg)" />

<!-- Copyright -->
<text x="70" y="70" fill="#10101a" font-family="monospace" font-size="20">© 2026 by Edwin Vermeer</text>
<text x="70" y="640" fill="#101032" font-family="monospace" font-size="20">© 2026 by Edwin Vermeer</text>

<!-- ================= LEFT COLUMN: USER INPUT ================= -->

<!-- User -->
<rect x="40" y="310" width="100" height="50" rx="8" stroke="#00f5ff" fill="none" stroke-width="1.5"/>
<text x="90" y="340" fill="#00f5ff" text-anchor="middle" font-family="monospace" font-size="13">User</text>

<!-- Arrow User → Prompt Builder -->
<line x1="140" y1="335" x2="180" y2="335" stroke="#00f5ff" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

<!-- Prompt Builder -->
<rect x="185" y="310" width="130" height="50" rx="8" stroke="#00f5ff" fill="none" stroke-width="1.5"/>
<text x="250" y="340" fill="#00f5ff" text-anchor="middle" font-family="monospace" font-size="12">Prompt Builder</text>

<!-- Arrow Prompt Builder → Orchestrator -->
<line x1="315" y1="335" x2="355" y2="335" stroke="#00f5ff" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

<!-- Orchestrator (expanded to encapsulate agent) -->
<rect x="360" y="190" width="510" height="290" rx="24" stroke="#ff00c8" fill="none" stroke-width="2.5"/>
<text x="475" y="230" fill="#ff00c8" text-anchor="middle" font-family="monospace" font-size="15">Orchestrator / Harness</text>

<!-- ================= CONTEXT (top-left) ================= -->
<rect x="185" y="120" width="130" height="45" rx="6" stroke="#f59e0b" fill="none" stroke-width="1.2"/>
<text x="250" y="147" fill="#f59e0b" text-anchor="middle" font-family="monospace" font-size="11">Repo Settings</text>

<rect x="185" y="180" width="130" height="45" rx="6" stroke="#f59e0b" fill="none" stroke-width="1.2"/>
<text x="250" y="207" fill="#f59e0b" text-anchor="middle" font-family="monospace" font-size="11">Policies</text>

<!-- Dotted lines from context to orchestrator border -->
<g>
  <line x1="315" y1="145" x2="360" y2="210" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 3">
    <animate attributeName="stroke" values="#f59e0b;#ffe082;#f59e0b" keyTimes="0;0.083;1" dur="4.2s" begin="0.2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1;1.8;1" keyTimes="0;0.083;1" dur="4.2s" begin="0.2s" repeatCount="indefinite"/>
  </line>
  <line x1="315" y1="145" x2="360" y2="210" stroke="#fff3bf" stroke-width="4" stroke-dasharray="4 3" stroke-linecap="round" opacity="0" filter="url(#lineShine)">
    <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.083;1" dur="4.2s" begin="0.2s" repeatCount="indefinite"/>
  </line>
</g>
<g>
  <line x1="315" y1="200" x2="360" y2="250" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 3">
    <animate attributeName="stroke" values="#f59e0b;#ffe082;#f59e0b" keyTimes="0;0.071;1" dur="4.9s" begin="1.1s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1;1.8;1" keyTimes="0;0.071;1" dur="4.9s" begin="1.1s" repeatCount="indefinite"/>
  </line>
  <line x1="315" y1="200" x2="360" y2="250" stroke="#fff3bf" stroke-width="4" stroke-dasharray="4 3" stroke-linecap="round" opacity="0" filter="url(#lineShine)">
    <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.071;1" dur="4.9s" begin="1.1s" repeatCount="indefinite"/>
  </line>
</g>

